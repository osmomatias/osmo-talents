<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Página "não encontrada": aparece quando alguém abre um endereço que não existe no site.
     O servidor manda esta página com o código 404, para o Google entender que ali não há nada
     e não guardar páginas vazias. Cores e texto ficam aqui dentro, como na offline.html. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A0B3C">
<meta name="robots" content="noindex">
<title>Página não encontrada · Osmo Talents</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; --bg:#170810; --text:#F6ECF0; --muted:#C9AEBB; --accent:#E8650F; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg:#FAF6F7; --text:#2A0E1B; --muted:#6E5560; --accent:#7A0B3C; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--text); font: 17px/1.6 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 26rem; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.6rem; margin: 18px 0 8px; }
  p { color: var(--muted); margin: 0 0 22px; }
  a.btn { display: inline-block; font-weight: 600; padding: 12px 22px; border-radius: 999px; text-decoration: none;
    background: var(--accent); color: #fff; }
  a.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Página não encontrada</h1>
  <p>Esse endereço não existe ou mudou de lugar. A página inicial leva você de volta ao que importa.</p>
  <a class="btn" href="/">Ir para a página inicial</a>
</main>
</body>
</html>
