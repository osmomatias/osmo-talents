<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- ============================================================================
     EXPLICANDO COMO PARA UMA CRIANÇA: o que é este arquivo?
     ============================================================================
     É o "esqueleto" do site: a primeira coisa que o navegador baixa.
     Ele quase não tem conteúdo de verdade, só as partes fixas:
     o cabeçalho com o logo e o menu, um espaço vazio no meio (id="view")
     e o rodapé. Quem enche o espaço do meio com as telas é o app.js.
     Aqui no <head> ficam as "informações sobre a página": o título da aba,
     a descrição que aparece no Google e quando alguém compartilha o link,
     o ícone, as fontes e as folhas de estilo (as roupas do site). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osmo Talents</title>
<meta name="description" content="Trabalho freelance para mentes neurodivergentes: briefing claro, comunicação combinada e pagamento por etapa.">
<meta name="theme-color" content="#7A0B3C">
<meta property="og:title" content="Osmo Talents">
<meta property="og:description" content="Trabalho freelance para mentes neurodivergentes: briefing claro, comunicação combinada e pagamento por etapa.">
<meta property="og:type" content="website">
<meta property="og:image" content="/favicon.svg">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Osmo Talents">
<meta name="twitter:description" content="Trabalho freelance para mentes neurodivergentes: briefing claro, comunicação combinada e pagamento por etapa.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- PWA: o manifest diz ao celular/computador o nome, o ícone e as cores do app instalado;
     o iPhone ainda usa as linhas "apple" abaixo (ele não aceita ícone em SVG). -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Osmo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- theme.js vem ANTES do CSS de propósito: ele liga o tema escuro e as
     preferências antes de qualquer coisa aparecer, para a tela não piscar. -->
<script src="/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/styles.css">
</head>
<!-- O corpo da página: tudo daqui para baixo é o que aparece na tela. -->
<body>
<!-- CABEÇALHO: o logo da Osmo (desenhado em SVG, que é um desenho feito de
     números e por isso fica nítido em qualquer tamanho), o menu principal
     e o espaço para os botões de entrar, perfil etc. (topActions). -->
<header class="top">
  <div class="wrap">
    <button class="brand" data-go="inicio" aria-label="Osmo Talents, início"><svg viewBox="0 0 94.2 30" aria-hidden="true"><path d="M15.12,10.53c-2.49,0-4.5,2.020-4.5,4.5s2.02,4.5,4.5,4.5,4.5-2.02,4.5-4.5-2.02-4.5-4.5-4.5ZM25.84,4.36C22.9,1.45,19.32,0,15.09,0S7.29,1.45,4.37,4.36C1.46,7.27,0,10.8,0,14.97s1.46,7.740,4.37,10.66,6.49,4.37,10.72,4.37,7.79-1.46,10.73-4.37c.65-.65,1.22-1.33,1.73-2.04-1.76-2.49-2.65-5.36-2.65-8.62s.89-6.11,2.66-8.59c-.51-.7-1.07-1.380-1.72-2.03ZM21.930,21.94c-1.890,1.92-4.18,2.89-6.86,2.89s-4.96-.96-6.84-2.87c-1.88-1.91-2.82-4.24-2.82-6.99s.94-5.01,2.82-6.93c1.88-1.91,4.16-2.87,6.84-2.87s4.97.96,6.86,2.87c1.89,1.91,2.84,4.22,2.840,6.93s-.95,5.05-2.84,6.97ZM41.77,7.55c-4.37,0-7.45,3.23-7.45,7.35s3.09,7.55,7.45,7.55,7.45-3.31,7.45-7.55-3.09-7.35-7.45-7.35ZM41.77,20.06c-2.76,0-4.75-2.23-4.75-5.16s1.99-4.95,4.75-4.95,4.75,2.15,4.75,4.95-1.99,5.16-4.75,5.16ZM86.75,7.55c-4.37,0-7.45,3.23-7.45,7.35s3.09,7.55,7.45,7.55,7.45-3.31,7.45-7.55-3.09-7.35-7.45-7.35ZM86.75,20.06c-2.76,0-4.75-2.23-4.75-5.16s1.99-4.95,4.75-4.95,4.75,2.15,4.75,4.95-1.99,5.16-4.75,5.16ZM75.38,7.79h-1.26c-.51,0-.81.22-.97.69l-2.58,6.44c-.32.85-.71,2.11-.71,2.11h-.04s-.41-1.26-.73-2.11l-2.58-6.44c-.16-.47-.47-.69-.95-.69h-1.28c-.53,0-.81.28-.87.81l-1.04,12.73c-.04.55.24.87.81.87h.91c.55,0,.83-.28.87-.81l.55-7.25c.06-.95.02-2.25.02-2.25h.04s.47,1.42.79,2.25l2.07,4.91c.16.45.47.67.97.67h.85c.49,0,.79-.22.95-.67l2.09-4.91c.32-.83.77-2.23.77-2.23h.04s-.04,1.28.02,2.23l.55,7.25c.04.53.34.81.87.81h.91c.57,0,.85-.33.81-.87l-1.04-12.73c-.04-.53-.35-.81-.87-.81ZM53.66,11.59c0-.97.85-1.62,2.19-1.62,1.12,0,1.91.45,2.5.79.43.22.85.3,1.16-.28l.37-.67c.24-.45.18-.83-.26-1.16-.61-.45-2.01-1.1-3.72-1.1-2.74,0-4.85,1.64-4.85,4.180,0,4.49,6.72,3.92,6.72,6.66,0,.98-.81,1.65-2.15,1.65-1.42,0-2.46-.73-2.92-1.06-.51-.28-.85-.26-1.18.18l-.45.65c-.41.55-.2.89.12,1.18.71.55,2.38,1.46,4.43,1.46,3.03,0,4.77-1.930,4.77-4.26,0-4.59-6.72-3.9-6.72-6.6Z"/></svg><span class="sub">Talents</span></button>
    <nav class="nav" id="nav" aria-label="Principal">
      <button data-go="vagas"><span class="nav-long">Encontrar trabalho</span><span class="nav-short">Vagas</span></button>
      <button data-go="talentos"><span class="nav-long">Encontrar talentos</span><span class="nav-short">Talentos</span></button>
      <button data-go="mensagens">Mensagens<span class="badge" data-unread hidden></span></button>
      <button data-go="painel">Painel</button>
      <button data-go="tarefas">Tarefas</button>
    </nav>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>
<!-- O PALCO: o app.js troca o que aparece aqui dentro a cada tela. -->
<main><div class="wrap" id="view"><p class="loading">Carregando…</p></div></main>
<!-- RODAPÉ: links de privacidade e termos, e um aviso sobre os pagamentos
     (o app.js troca esse texto quando os pagamentos estão ligados). -->
<footer class="foot"><div class="wrap row" style="justify-content:space-between">
  <span>Osmo Talents · uma iniciativa <a href="https://osmo.com.br" style="color:inherit">Osmo</a> · <a href="/privacidade" style="color:inherit">Privacidade</a> · <a href="/termos" style="color:inherit">Termos</a></span>
  <span id="payNote">Pagamentos ainda simulados durante o período de testes.</span>
</div></footer>
<!-- MENU DE CELULAR: a cortina escura de fundo (scrim) e o menu que desliza
     da direita. Começam escondidos (hidden) até alguém apertar o botão. -->
<div class="mm-scrim" id="mmScrim" hidden></div>
<nav class="mmenu" id="mmenu" aria-label="Menu principal" hidden>
  <div class="mm-head"><span class="label">Menu</span><button class="mm-close" id="mmClose" aria-label="Fechar menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="mmBody"></div>
</nav>
<!-- A barra de navegação que fica embaixo no celular (perto do polegar), e
     uma "camada" (layer) onde aparecem painéis por cima de tudo (Ajustes,
     confirmações). O app.js monta o conteúdo dos dois. -->
<nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
<div id="layer"></div>
<!-- O programa principal. "defer" = baixa enquanto a página monta, mas só
     roda quando o esqueleto inteiro já estiver pronto. -->
<script src="/app.js" defer></script>
</body>
</html>
