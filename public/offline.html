<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- ============================================================================
     EXPLICANDO COMO PARA UMA CRIANÇA: o que é este arquivo?
     ============================================================================
     É a página que aparece quando o app está instalado (ou o site já foi
     aberto antes) e a internet some. O sw.js guarda esta página no aparelho
     e a mostra no lugar do erro feio do navegador.
     Tudo fica aqui dentro (cores e texto), porque sem internet não dá para
     buscar o styles.css. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A0B3C">
<title>Sem internet · Osmo Talents</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; --bg:#170810; --text:#F6ECF0; --muted:#C9AEBB; --accent:#E8650F; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg:#FAF6F7; --text:#2A0E1B; --muted:#6E5560; --accent:#7A0B3C; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--text); font: 17px/1.6 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 26rem; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.6rem; margin: 18px 0 8px; }
  p { color: var(--muted); margin: 0 0 22px; }
  button { font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Você está sem internet</h1>
  <p>Quando a conexão voltar, esta tela recarrega sozinha e a Osmo abre de novo onde você estava.</p>
  <button type="button" id="retry">Tentar de novo</button>
</main>
<!-- o CSP não deixa script escrito dentro da página, por isso o botão mora no offline.js -->
<script src="/offline.js"></script>
</body>
</html>
