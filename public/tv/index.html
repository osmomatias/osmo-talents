<main>
  <section class="hero" id="hero" aria-live="polite">
    <span class="eyebrow" id="hEyebrow">Top 10</span>
    <h1 id="hTitle">Carregando…</h1>
    <p class="meta" id="hMeta"></p>
    <p class="overview" id="hOverview"></p>
  </section>
  <div class="rows" id="rows"></div>
</main>

<!-- PLAYER dos Osmo Originais: cobre a tela toda; a barra some sozinha enquanto o vídeo toca -->
<div class="player" id="player" hidden>
  <video id="pv" playsinline preload="metadata"></video>
  <p class="pstate" id="pState" role="status" hidden></p>
  <div class="pbar">
    <div class="phead"><b id="pTitle"></b><button type="button" id="pClose" class="pclose">Fechar</button></div>
    <div class="ptrack"><i id="pFill"></i></div>
    <div class="pfoot"><span id="pTime">0:00 / 0:00</span><span class="phint">OK pausa · ◀ ▶ 10 s · Voltar fecha</span></div>
  </div>
</div>
