plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.osmo.talents.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.osmo.talents.tv'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.3.0'
        // endereço que o app abre; troque para testar com o servidor local (ex.: http://10.0.2.2:3000)
        buildConfigField 'String', 'START_URL', '"https://app.osmo.com.br/tv/"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
